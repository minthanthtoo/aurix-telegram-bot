<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuriX — Hello, world</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7fb;
      --muted: #a8b5c7;
      --line: rgba(255, 255, 255, .12);
      --panel: rgba(12, 25, 45, .72);
      --cyan: #39c5f5;
      --gold: #f3bf62;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(57, 197, 245, .2), transparent 34%),
        radial-gradient(circle at 88% 86%, rgba(243, 191, 98, .13), transparent 32%),
        #050b16;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(16, 34, 60, .86), var(--panel));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .78rem;
      font-weight: 700;
    }

    .brand img { width: 42px; height: 42px; }

    h1 {
      margin: 36px 0 12px;
      max-width: 10ch;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: .94;
      letter-spacing: -.06em;
    }

    p {
      max-width: 36rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .92rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 18px rgba(243, 191, 98, .75);
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="../brand/v2/aurix-logo-mark-v2.svg" alt="AuriX mark">
      <span>AuriX network</span>
    </div>
    <h1>Hello, world.</h1>
    <p>The Myanmar-first VPN control experience is taking shape. This is the first public-facing page; the management portal and Telegram flow will follow.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span><span>Launch page — the AuriX foundation is online</span></div>
  </main>
</body>
</html>
