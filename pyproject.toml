[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Phase 0 freezes correctness checks without mixing formatting churn into the
# refactor baseline. Broader style rules can be enabled module-by-module.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = [
    "access_control",
    "app",
    "commerce",
    "commerce_models",
    "commerce_order_repository",
    "commerce_payment_repository",
    "capacity_policy",
    "commerce_repositories",
