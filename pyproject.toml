[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Phase 0 freezes correctness checks without mixing formatting churn into the
# refactor baseline. Broader style rules can be enabled module-by-module.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "test_*.py", "*/tests/*", "*/fixtures/*",
    "*/.venv/*", "*/venv/*", "*/project-venv/*",
    "*/graphify-out/*", "*/build/*", "*/dist/*",
]

[tool.coverage.report]
include_namespace_packages = true
fail_under = 60
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["domain_time.py", "notification_contracts.py", "notification_worker.py"]
