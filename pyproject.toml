[project]
name = "aurix-vpn-bot"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=42,<47",
    "opencv-python-headless>=4.10,<5",
    "psycopg[binary]>=3.1,<4",
    "psycopg-pool>=3.2,<4",
    "urllib3>=2.2,<3",
]

[dependency-groups]
dev = [
    "coverage==7.13.4",
    "ruff==0.13.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Phase 0 freezes correctness checks without mixing formatting churn into the
# refactor baseline. Broader style rules can be enabled module-by-module.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = [
    "app",
    "commerce",
    "commerce_models",
    "commerce_repositories",
    "commerce_service",
    "commerce_worker",
    "entitlements",
    "free_repository",
    "migrations",
    "observability",
    "outline_adapter",
    "persistence",
    "ports",
    "repositories",
    "receipt_llm",
    "aurix_ai",
    "aurix_vpn",
    "runtime",
    "supabase_storage",
    "telegram_transport",
    "telegram_admin",
    "telegram_admin_panels",
    "telegram_callbacks",
    "telegram_commands",
    "telegram_maintenance",
    "deploy",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
]
