          stroke-opacity="0.65" stroke-dasharray="10 7"/>
    <!-- Clear cyan path — the AuriX guided route -->
    <path d="M22 175 Q62 152 100 160 Q155 170 196 134 Q234 100 268 76"
          fill="none" stroke="#36E2FF" stroke-width="5.5" stroke-linecap="round"
