<?xml version="1.0" encoding="UTF-8"?>
<!--
  AuriX Setup Rescue v1 r2 — improved composition
  Canvas: 1080 × 1350 px  (4:5 portrait, Facebook feed)
  Standard: AURIX-SOCIAL-S1
  Reading path: ပြဿနာ → Screenshot ပို့ → AuriX Group → @aurix_outline_vpn_bot
  Changes from r1:
  - Tightened dead zone: scene moved up to y≈480, gives more visual density
  - Laptop screen: brighter error state, more contrast
  - Proof card: enlarged text, better leading
  - Bot cluster at bottom: simplified, cleaner, larger handle
  - Gold underline aligned precisely under hook line 2
  - Headline hierarchy: supporting line repositioned closer to hook
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1080 1350"
     width="1080" height="1350"
     role="img"
     aria-labelledby="post-title post-desc">

  <title id="post-title">AuriX Setup Rescue — Outline Key ထည့်မရဘူးလား?</title>
  <desc id="post-desc">S1 standard. Reading path: problem → screenshot → Group → bot handle.</desc>

  <defs>
    <linearGradient id="g-gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF982F"/><stop offset="1" stop-color="#FFD36A"/>
    </linearGradient>
    <linearGradient id="g-shared" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD36A"/>
      <stop offset="0.46" stop-color="#FFC254"/>
      <stop offset="0.64" stop-color="#46D9F5"/>
      <stop offset="1" stop-color="#7667F5"/>
    </linearGradient>
    <linearGradient id="g-signal" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31D9F5"/><stop offset="1" stop-color="#7862F2"/>
    </linearGradient>
    <linearGradient id="g-cv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36E2FF"/><stop offset="1" stop-color="#7765FF"/>
    </linearGradient>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071421"/><stop offset="1" stop-color="#0D2235"/>
    </linearGradient>

    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-warmglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-shadow" x="-8%" y="-4%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="f-card" x="-4%" y="-3%" width="112%" height="118%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ─── BACKGROUND ─────────────────────────────── -->
