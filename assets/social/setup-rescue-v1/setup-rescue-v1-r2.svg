  <g transform="translate(72 52) scale(0.29)">
    <rect width="272" height="272" rx="72" fill="#071521"/>
    <rect x="1" y="1" width="270" height="270" rx="71" fill="none" stroke="#18334A" stroke-width="2"/>
    <path d="M53 224 124 66" fill="none" stroke="url(#g-gold)" stroke-width="28" stroke-linecap="round"/>
    <path d="m124 66 81 158" fill="none" stroke="url(#g-shared)" stroke-width="28" stroke-linecap="round"/>
    <path d="M84 172h74" fill="none" stroke="#E7EEF5" stroke-width="14" stroke-linecap="round"/>
    <circle cx="172" cy="159" r="19" fill="#071521"/>
    <path d="M218 72 137 224" fill="none" stroke="url(#g-signal)" stroke-width="24" stroke-linecap="round"/>
  </g>
  <text x="156" y="122" fill="#F6F8FC"
        font-family="Inter, Avenir Next, Arial, sans-serif"
        font-size="50" font-weight="750" letter-spacing="-2">Auri<tspan dx="-1" fill="url(#g-signal)">X</tspan></text>
  <text x="157" y="145" fill="#526273"
        font-family="Inter, Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="0.4">Clear access. Human help.</text>

  <!-- Outline secondary mark — top right -->
  <rect x="898" y="52" width="110" height="110" rx="20" fill="#0D2F1E" filter="url(#f-shadow)"/>
  <circle cx="953" cy="100" r="32" fill="none" stroke="#00BF72" stroke-width="8"/>
  <circle cx="953" cy="100" r="13" fill="#00BF72"/>
  <text x="953" y="178" text-anchor="middle" fill="#52736A"
        font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Outline VPN</text>

  <!-- ─── HEADLINE ───────────────────────────────── -->

  <!-- Hook line 1 -->
  <text x="72" y="266" fill="#F6F8FC"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="56" font-weight="700"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">Outline Key</text>

  <!-- Gold underline — under hook line 2 -->
  <rect x="72" y="316" width="600" height="14" rx="7" fill="#FFC857" fill-opacity="0.75"/>

  <!-- Hook line 2 — tension, aurora cyan -->
  <text x="72" y="348" fill="#36E2FF"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="68" font-weight="800"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">ထည့်မရဘူးလား?</text>

  <!-- Supporting line — just below, same rhythm -->
  <text x="72" y="402" fill="#7B92A8"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="32" font-weight="400"
