    <!-- Map sheet -->
    <rect width="296" height="204" rx="10" fill="#EDF2F7" filter="url(#f-card)"/>
    <!-- Fold crease -->
    <line x1="148" y1="0" x2="148" y2="204" stroke="#C9D6E2" stroke-width="1.5" stroke-dasharray="6 4"/>
    <!-- Grid -->
    <line x1="0" y1="68" x2="296" y2="68" stroke="#C9D6E2" stroke-width="0.8"/>
    <line x1="0" y1="136" x2="296" y2="136" stroke="#C9D6E2" stroke-width="0.8"/>
    <line x1="99" y1="0" x2="99" y2="204" stroke="#C9D6E2" stroke-width="0.8"/>
    <line x1="198" y1="0" x2="198" y2="204" stroke="#C9D6E2" stroke-width="0.8"/>
    <!-- Tangled route — the wrong path (orange dashed) -->
    <path d="M22 175 Q55 112 82 152 Q110 192 138 122 Q158 78 143 48"
