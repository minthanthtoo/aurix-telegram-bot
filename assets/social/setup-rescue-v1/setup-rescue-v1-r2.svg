  <rect x="152" y="472" width="306" height="198" rx="14" fill="#0D2235" filter="url(#f-shadow)"/>
  <rect x="164" y="483" width="282" height="176" rx="6" fill="#071A2E"/>
  <!-- Laptop hinge + base -->
  <rect x="122" y="668" width="366" height="18" rx="9" fill="#132840"/>
  <ellipse cx="305" cy="676" rx="183" ry="11" fill="#0D2235"/>

  <!-- Screen: bright error dots — visible even at thumbnail -->
  <circle cx="208" cy="540" r="9" fill="#FF6B6B" filter="url(#f-glow)"/>
  <circle cx="260" cy="520" r="7" fill="#FFB547" filter="url(#f-glow)"/>
  <circle cx="320" cy="552" r="8" fill="#FF6B6B" filter="url(#f-glow)"/>
  <!-- Error lines on screen -->
