  <!-- Aurora bloom -->
  <ellipse cx="880" cy="200" rx="360" ry="210" fill="#36E2FF" fill-opacity="0.035"/>
  <ellipse cx="840" cy="250" rx="180" ry="110" fill="#7765FF" fill-opacity="0.045"/>

  <!-- ─── BRAND HEADER ──────────────────────────── -->

