  <rect x="736" y="520" width="72" height="7" rx="3" fill="#526273" fill-opacity="0.8"/>
  <rect x="736" y="533" width="52" height="7" rx="3" fill="#526273" fill-opacity="0.6"/>
  <rect x="736" y="546" width="62" height="7" rx="3" fill="#526273" fill-opacity="0.5"/>
  <text x="792" y="572" fill="#526273" fill-opacity="0.7"
        font-family="Inter, Arial, sans-serif" font-size="12">12:04</text>

  <!-- AuriX Admin reply bubble -->
  <rect x="662" y="592" width="170" height="82" rx="14" fill="#0D2F1E"/>
  <!-- AuriX mini wordmark -->
  <text x="674" y="614" fill="#36E2FF"
        font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">AuriX Admin</text>
  <rect x="674" y="622" width="120" height="7" rx="3" fill="#42D392" fill-opacity="0.7"/>
  <rect x="674" y="635" width="140" height="7" rx="3" fill="#42D392" fill-opacity="0.55"/>
  <rect x="674" y="648" width="96" height="7" rx="3" fill="#42D392" fill-opacity="0.45"/>
  <text x="674" y="666" fill="#42D392"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="12" font-weight="600"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">✓ ဖြေပေးနေပါပြီ</text>

  <!-- Green tick / resolved -->
  <rect x="662" y="686" width="170" height="40" rx="14" fill="#0D2235"/>
  <text x="748" y="711" text-anchor="middle" fill="#42D392"
        font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">✓</text>

  <!-- Thin cyan connecting line: map corner → phone -->
  <line x1="642" y1="560" x2="654" y2="560" stroke="#36E2FF" stroke-width="2" stroke-opacity="0.5"/>

  <!-- ─── PROOF CARD ─────────────────────────────── -->

  <rect x="72" y="870" width="640" height="244" rx="22" fill="#0D2235" filter="url(#f-card)"/>
  <!-- Left cyan bar -->
  <rect x="72" y="870" width="7" height="244" rx="3.5" fill="url(#g-cv)"/>

  <!-- Step 1 -->
  <circle cx="128" cy="930" r="24" fill="#071421"/>
  <text x="128" y="937" text-anchor="middle" fill="#36E2FF"
        font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">1</text>

  <text x="168" y="920" fill="#F6F8FC"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="36" font-weight="700"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">Screenshot တစ်ခုပို့</text>
  <text x="168" y="953" fill="#7B92A8"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="23" font-weight="400"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">ဖြစ်နေတဲ့ Screen ကို Capture လုပ်ပြီး ပို့</text>

  <!-- Divider -->
  <line x1="104" y1="978" x2="692" y2="978" stroke="#18334A" stroke-width="1"/>

  <!-- Step 2 -->
  <circle cx="128" cy="1040" r="24" fill="#071421"/>
  <text x="128" y="1047" text-anchor="middle" fill="#FFC857"
        font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">2</text>

  <text x="168" y="1030" fill="#F6F8FC"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="36" font-weight="700"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">AuriX Group မှာ မေးပါ</text>
  <text x="168" y="1063" fill="#7B92A8"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="23" font-weight="400"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">Admin က ကိုယ်တိုင် ကူညီပေးမယ်</text>

  <!-- Sub note -->
  <text x="104" y="1095" fill="#526273"
        font-family="Noto Sans Myanmar, Myanmar Sangam MN, sans-serif"
        font-size="19" font-weight="400"
        xml:lang="my" style="font-kerning:normal;font-feature-settings:'mark' 1,'mkmk' 1;">ဘာ App ကိုသုံးမလဲ ဒါမှမဟုတ် ဘာ Error ဆိုတာ မသိသေးရင်လဲ မေးနိုင်တယ်</text>

  <!-- ─── BOTTOM — Bot identity + handle ────────── -->

  <!-- Separator line -->
  <rect x="72" y="1148" width="936" height="2" rx="1" fill="url(#g-cv)" fill-opacity="0.25"/>

  <!-- AuriX Bot avatar — clean circle with mark -->
  <circle cx="130" cy="1232" r="58" fill="#071521" stroke="#18334A" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- AuriX V2 mark at readable size -->
  <g transform="translate(88 1190) scale(0.31)">
    <rect width="272" height="272" rx="72" fill="#071521"/>
    <path d="M53 224 124 66" fill="none" stroke="url(#g-gold)" stroke-width="28" stroke-linecap="round"/>
    <path d="m124 66 81 158" fill="none" stroke="url(#g-shared)" stroke-width="28" stroke-linecap="round"/>
    <path d="M84 172h74" fill="none" stroke="#E7EEF5" stroke-width="14" stroke-linecap="round"/>
    <circle cx="172" cy="159" r="19" fill="#071521"/>
    <path d="M218 72 137 224" fill="none" stroke="url(#g-signal)" stroke-width="24" stroke-linecap="round"/>
  </g>
  <!-- Telegram badge -->
  <circle cx="170" cy="1185" r="24" fill="#229ED9"/>
  <!-- Paper-plane simplified -->
  <path d="M161 1185 L178 1179 L172 1191 L165 1187 Z" fill="white"/>
  <path d="M165 1187 L172 1191 L169 1196 Z" fill="white" fill-opacity="0.8"/>
  <circle cx="170" cy="1185" r="26" fill="none" stroke="#071421" stroke-width="4"/>

  <!-- Handle and tagline -->
  <text x="208" y="1224" fill="#36E2FF"
        font-family="Inter, Avenir Next, Arial, sans-serif"
        font-size="32" font-weight="700">@aurix_outline_vpn_bot</text>
  <text x="208" y="1254" fill="#526273"
        font-family="Inter, Arial, sans-serif"
