  </g>

  <!-- === PHONE === (right mid) -->
  <rect x="640" y="452" width="216" height="394" rx="32" fill="#0D2235" filter="url(#f-shadow)"/>
  <rect x="652" y="466" width="192" height="366" rx="24" fill="#071A2E"/>
  <!-- Notch -->
  <rect x="702" y="466" width="72" height="21" rx="10" fill="#0D2235"/>

  <!-- Chat bubbles — abstract, no fake UI -->
  <!-- User message: screenshot thumbnail -->
  <rect x="664" y="506" width="154" height="74" rx="14" fill="#1A3550"/>
  <rect x="672" y="514" width="58" height="52" rx="8" fill="#0D2235"/>
  <text x="701" y="546" text-anchor="middle" fill="#36E2FF"
