    <path d="m239 116 145 282" fill="none" stroke="url(#mark-shared)" stroke-width="50" stroke-linecap="round"/>
    <path d="M167 305h133" fill="none" stroke="#E7EEF5" stroke-width="24" stroke-linecap="round"/>
    <circle cx="325" cy="283" r="33" fill="#071521"/>
    <path d="M408 127 263 398" fill="none" stroke="url(#mark-signal)" stroke-width="42" stroke-linecap="round"/>
