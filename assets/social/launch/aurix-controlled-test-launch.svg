  <text x="184" y="140" fill="#F6F8FC" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1.5">Auri<tspan fill="#36E2FF">X</tspan></text>
  <text x="84" y="260" fill="#FFC857" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2.4">CONTROLLED TEST · MYANMAR</text>
  <text x="84" y="374" fill="#F6F8FC" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-3">Help us test</text>
  <text x="84" y="462" fill="#F6F8FC" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-3">Auri<tspan fill="#36E2FF">X</tspan>.</text>
  <text x="84" y="542" fill="#C8D5E0" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="30" font-weight="600">A small tester group before public launch.</text>
  <text x="84" y="590" fill="#C8D5E0" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="30" font-weight="600">Clear limits. Human help. Real feedback.</text>
