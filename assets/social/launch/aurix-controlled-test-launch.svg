  <text x="84" y="794" fill="#91A4B5" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing=".3">LIMITED TEST · FEEDBACK REQUIRED</text>
  <text x="84" y="824" fill="#91A4B5" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing=".3">ACCESS BY APPROVAL AND AVAILABILITY</text>
