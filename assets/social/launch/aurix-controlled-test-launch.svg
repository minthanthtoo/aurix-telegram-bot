      <stop stop-color="#071421" stop-opacity=".92"/>
      <stop offset=".72" stop-color="#071421" stop-opacity=".46"/>
      <stop offset="1" stop-color="#071421" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#36E2FF"/>
      <stop offset="1" stop-color="#7765FF"/>
    </linearGradient>
    <linearGradient id="mark-gold" x1="104" y1="402" x2="250" y2="104" gradientUnits="userSpaceOnUse"><stop stop-color="#FF982F"/><stop offset="1" stop-color="#FFD36A"/></linearGradient>
    <linearGradient id="mark-shared" x1="238" y1="108" x2="388" y2="405" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD36A"/><stop offset=".46" stop-color="#FFC254"/><stop offset=".64" stop-color="#46D9F5"/><stop offset="1" stop-color="#7667F5"/></linearGradient>
    <linearGradient id="mark-signal" x1="410" y1="122" x2="260" y2="402" gradientUnits="userSpaceOnUse"><stop stop-color="#31D9F5"/><stop offset="1" stop-color="#7862F2"/></linearGradient>
  </defs>
  <image xlink:href="aurix-controlled-test-launch-plate.png" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect width="720" height="980" fill="url(#left-shade)"/>
