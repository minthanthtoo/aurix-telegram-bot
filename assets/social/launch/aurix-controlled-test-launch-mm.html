<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>AuriX Burmese controlled-test launch</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #071421; }
    body { font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", sans-serif; }
    .canvas { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #f6f8fc; }
    .plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .shade { position: absolute; inset: 0 auto auto 0; width: 760px; height: 1000px; background: linear-gradient(90deg, rgba(7,20,33,.95) 0%, rgba(7,20,33,.68) 62%, rgba(7,20,33,0) 100%); }
    .content { position: absolute; left: 84px; top: 84px; width: 680px; }
    .brand { display: flex; align-items: center; gap: 20px; height: 80px; }
    .brand img { width: 80px; height: 80px; }
    .wordmark { font-family: Inter, "Avenir Next", Arial, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
    .wordmark span { color: #36e2ff; }
    .label { margin-top: 66px; color: #ffc857; font-size: 24px; line-height: 1.65; font-weight: 700; }
    h1 { margin: 32px 0 0; width: 670px; font-size: 60px; line-height: 1.55; font-weight: 800; letter-spacing: -.8px; }
    .support { margin-top: 23px; color: #c8d5e0; font-size: 28px; line-height: 1.75; font-weight: 600; }
    .cta { display: inline-flex; align-items: center; justify-content: center; min-width: 350px; height: 78px; margin-top: 30px; padding: 0 30px; border-radius: 39px; background: linear-gradient(135deg,#36e2ff,#7765ff); color: #071421; font-size: 24px; line-height: 1; font-weight: 800; white-space: nowrap; }
    .terms { margin-top: 28px; color: #91a4b5; font-size: 19px; line-height: 1.8; font-weight: 700; }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="plate" src="aurix-controlled-test-launch-plate.png" alt="">
    <div class="shade"></div>
    <section class="content">
      <div class="brand">
        <img src="../../../brand/v2/aurix-logo-mark-v2.svg" alt="">
        <div class="wordmark">Auri<span>X</span></div>
      </div>
      <div class="label">ကနဦး စမ်းသပ်သူများ ဖိတ်ခေါ်နေပါပြီ</div>
      <h1>AuriX ကို<br>အတူစမ်းကြည့်ရအောင်။</h1>
      <div class="support">အများပြည်သူသုံး မဖွင့်မီ<br>စမ်းသပ်သူ အနည်းငယ်ကို ဖိတ်ခေါ်နေပါတယ်။</div>
      <div class="cta">Telegram မှာ စာရင်းပေးပါ</div>
      <div class="terms">နေရာကန့်သတ်ထားသည် · အကြံပြုချက်ပေးရန်လိုသည်<br>အတည်ပြုပြီးမှ အသုံးပြုနိုင်သည်</div>
    </section>
  </main>
</body>
</html>
