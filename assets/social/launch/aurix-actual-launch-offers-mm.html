<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>AuriX actual launch offer ladder — Burmese</title>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; width:1080px; height:1350px; overflow:hidden; background:#071421; }
    body { font-family:"Noto Sans Myanmar","Myanmar Sangam MN",sans-serif; }
    .canvas { position:relative; width:1080px; height:1350px; overflow:hidden; color:#f6f8fc; }
    .plate { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .shade { position:absolute; inset:0; background:linear-gradient(90deg,rgba(7,20,33,.98) 0%,rgba(7,20,33,.9) 48%,rgba(7,20,33,.28) 75%,rgba(7,20,33,.03) 100%); }
    .content { position:absolute; left:78px; top:70px; width:665px; }
    .brand { display:flex; align-items:center; gap:18px; height:76px; }
    .brand img { width:76px; height:76px; }
    .wordmark { font-family:Inter,"Avenir Next",Arial,sans-serif; font-size:39px; font-weight:800; letter-spacing:-1.5px; }
    .wordmark span { color:#36e2ff; }
    .label { margin-top:43px; color:#ffc857; font-size:23px; line-height:1.65; font-weight:750; }
    h1 { margin:19px 0 0; font-size:49px; line-height:1.52; font-weight:800; letter-spacing:-.5px; }
    .free-card { margin-top:25px; width:565px; min-height:177px; padding:22px 28px; border:2px solid rgba(54,226,255,.42); border-radius:28px; background:linear-gradient(135deg,rgba(54,226,255,.14),rgba(119,101,255,.09)); box-shadow:0 18px 52px rgba(0,0,0,.2); }
    .eyebrow { color:#ffc857; font-size:20px; line-height:1.5; font-weight:750; }
    .free-values { display:flex; align-items:baseline; gap:22px; margin-top:10px; font-family:Inter,"Noto Sans Myanmar",sans-serif; }
    .free-values strong { color:#f6f8fc; font-size:39px; line-height:1.2; font-weight:850; }
    .free-values span { color:#9fb1c1; font-size:21px; font-weight:700; }
    .paid-label { margin-top:23px; color:#c8d5e0; font-size:20px; font-weight:700; }
    .plans { display:flex; gap:14px; margin-top:11px; }
    .plan { width:275px; padding:18px 20px 17px; border-radius:22px; background:rgba(13,34,53,.84); border:1px solid rgba(145,164,181,.22); }
    .plan strong { display:block; color:#36e2ff; font-family:Inter,"Noto Sans Myanmar",sans-serif; font-size:31px; line-height:1.25; font-weight:850; }
    .plan span { display:block; margin-top:4px; color:#f6f8fc; font-size:22px; line-height:1.55; font-weight:750; }
    .plan small { display:block; color:#91a4b5; font-size:17px; line-height:1.55; font-weight:650; }
    .cta { display:inline-flex; align-items:center; justify-content:center; min-width:310px; height:72px; margin-top:25px; padding:0 30px; border-radius:36px; background:linear-gradient(135deg,#36e2ff,#7765ff); color:#071421; font-size:24px; font-weight:850; white-space:nowrap; }
    .terms { margin-top:19px; color:#91a4b5; font-size:17px; line-height:1.75; font-weight:700; }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="plate" src="../v1/st-01-clear-gateway-plate.png" alt="">
    <div class="shade"></div>
    <section class="content">
      <div class="brand"><img src="../../../brand/v2/aurix-logo-mark-v2.svg" alt=""><div class="wordmark">Auri<span>X</span></div></div>
      <div class="label">AuriX စတင်မိတ်ဆက်ပါပြီ</div>
      <h1>အသုံးပြုခွင့် ရှင်းလင်း။<br>စတင်ရတာ လွယ်ကူ။</h1>
      <div class="free-card">
        <div class="eyebrow">လူတိုင်းအတွက် အခမဲ့</div>
        <div class="free-values"><strong>နေ့စဉ် 300 MB</strong><span>+</span></div>
        <div class="free-values"><strong>လစဉ် 3 GB</strong></div>
      </div>
      <div class="paid-label">အခပေးအစီအစဉ်များ · ရက် 30</div>
      <div class="plans">
        <div class="plan"><strong>50 GB</strong><span>3,000 ကျပ်</span><small>တစ်လစာ</small></div>
        <div class="plan"><strong>100 GB</strong><span>6,000 ကျပ်</span><small>တစ်လစာ</small></div>
      </div>
      <div class="cta">Telegram မှာ စတင်ပါ</div>
      <div class="terms">ရရှိနိုင်မှုနှင့် ဝန်ဆောင်မှုသတ်မှတ်ချက်များအပေါ် မူတည်သည်</div>
    </section>
  </main>
</body>
</html>
