<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>AuriX actual launch — Burmese</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #071421; }
    body { font-family: "Noto Sans Myanmar", "Myanmar Sangam MN", sans-serif; }
    .canvas { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #f6f8fc; }
    .plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg,rgba(7,20,33,.97) 0%,rgba(7,20,33,.82) 43%,rgba(7,20,33,.18) 72%,rgba(7,20,33,0) 100%); }
    .content { position: absolute; left: 84px; top: 78px; width: 650px; }
    .brand { display: flex; align-items: center; gap: 20px; height: 80px; }
    .brand img { width: 80px; height: 80px; }
    .wordmark { font-family: Inter,"Avenir Next",Arial,sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
    .wordmark span { color: #36e2ff; }
    .label { margin-top: 62px; color: #ffc857; font-size: 24px; line-height: 1.6; font-weight: 750; }
    h1 { margin: 28px 0 0; width: 650px; font-size: 58px; line-height: 1.55; font-weight: 800; letter-spacing: -.6px; }
    .offer { margin-top: 20px; color: #36e2ff; font-size: 31px; line-height: 1.6; font-weight: 800; }
    .support { margin-top: 8px; color: #c8d5e0; font-size: 24px; line-height: 1.7; font-weight: 650; }
    .cta { display: inline-flex; align-items: center; justify-content: center; min-width: 315px; height: 76px; margin-top: 30px; padding: 0 32px; border-radius: 38px; background: linear-gradient(135deg,#36e2ff,#7765ff); color: #071421; font-size: 25px; line-height: 1; font-weight: 850; white-space: nowrap; }
    .terms { margin-top: 25px; width: 570px; color: #91a4b5; font-size: 19px; line-height: 1.8; font-weight: 700; }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="plate" src="../v1/st-01-clear-gateway-plate.png" alt="">
    <div class="shade"></div>
    <section class="content">
      <div class="brand">
        <img src="../../../brand/v2/aurix-logo-mark-v2.svg" alt="">
        <div class="wordmark">Auri<span>X</span></div>
      </div>
      <div class="label">ယနေ့မှစပြီး အသုံးပြုနိုင်ပါပြီ</div>
      <h1>AuriX နဲ့<br>ရိုးရိုးရှင်းရှင်း စတင်ပါ။</h1>
      <div class="offer">နေ့စဉ် 300 MB · လစဉ် 3 GB အခမဲ့</div>
      <div class="support">ဒေတာပမာဏရှင်းလင်း · Telegram မှ အကူအညီ</div>
      <div class="cta">Telegram မှာ စတင်ပါ</div>
      <div class="terms">50 GB / 3,000 ကျပ် · 100 GB / 6,000 ကျပ် · ရက် 30</div>
    </section>
  </main>
</body>
</html>
