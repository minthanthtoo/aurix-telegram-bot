name: Games release package

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA with passing Games CI on main
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ inputs.commit }}
    steps:
      - name: Check artifact visibility
        env:
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE_REPO" != true ]; then
            echo 'Use an approved private artifact store before packaging from a public repository.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.4'
      - name: Require successful Games tests on the exact main revision
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Enter the full Git commit SHA.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"
          runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/games-ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -F per_page=100)"
          run_id="$(jq -er --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main"
              and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch"))]
            | max_by(.run_number) | select(.status == "completed" and .conclusion == "success") | .id
            ' <<< "$runs")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest" \
            --paginate --jq '.jobs[] | select(.name == "Games tests") | .conclusion' | grep -x success
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Build and verify the committed Games bundle
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          out="$RUNNER_TEMP/games-release/aurix-games.tgz"
          result="$(python scripts/package_game_store.py --commit "$RELEASE_SHA" --output "$out")"
          digest="$(jq -er '.source_sha256' <<< "$result")"
          python scripts/package_game_store.py --commit "$RELEASE_SHA" --output "$out" --verify-digest "$digest"
          {
            printf 'Commit: \`%s\`\n\nSHA-256: \`%s\`\n\n' "$RELEASE_SHA" "$digest"
            printf 'Games CI run: %s\n' "$CI_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aurix-games-${{ inputs.commit }}
          path: ${{ runner.temp }}/games-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
