name: Games production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check the deployment connection, deploy a passing main commit, or roll back
        type: choice
        options: [preflight, deploy, rollback]
        required: true
        default: preflight
      commit:
        description: Full commit SHA on main (deploy only)
        type: string
        required: false
      confirm_production:
        description: I intend to change the live Games service
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: games-production
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: games-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned SSH and deployment state
        env:
          GAMES_DEPLOY_HOST: ${{ vars.GAMES_DEPLOY_HOST }}
          GAMES_DEPLOY_PORT: ${{ vars.GAMES_DEPLOY_PORT }}
          GAMES_DEPLOY_PRIVATE_KEY: ${{ secrets.GAMES_DEPLOY_PRIVATE_KEY }}
          GAMES_DEPLOY_KNOWN_HOSTS: ${{ secrets.GAMES_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 scripts/aurix_games_release_transport.py status | jq -e '.status == "ok"'
          echo 'Restricted Games deploy account responded over pinned SSH.' >> "$GITHUB_STEP_SUMMARY"

  release:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation != 'preflight' && inputs.confirm_production && vars.GAMES_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: games-production
    permissions:
      actions: read
      contents: write
    env:
      INPUT_OPERATION: ${{ inputs.operation }}
      INPUT_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.4'

      - name: Require explicit production confirmation and valid SSH settings
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python -m py_compile scripts/aurix_games_release_transport.py deploy/aurix_games_deploy.py scripts/package_game_store.py

      - name: Verify the exact Games CI run for a deployment
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Enter a full lowercase commit SHA.' >&2
            exit 1
          fi
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"
          runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/games-ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -F per_page=100)"
          run_id="$(jq -er --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main"
              and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch")
              and .status == "completed" and .conclusion == "success")]
            | max_by(.run_number).id
          ' <<< "$runs")"
          jobs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest" \
            --jq '.jobs[] | select(.name == "Games tests" or .name == "Games check") | [.name, .conclusion] | @tsv')"
          grep -Fx $'Games tests\tsuccess' <<< "$jobs"
          grep -Fx $'Games check\tsuccess' <<< "$jobs"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit }}

      - name: Read the server state and package the selected release
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/aurix-games-release"
          mkdir -m 700 -p "$dir"
          python scripts/aurix_games_release_transport.py status > "$dir/status.json"
          jq -e '.status == "ok"' "$dir/status.json" >/dev/null
          state="$(jq -c '.state' "$dir/status.json")"

          release_tag() {
            [[ "$1" =~ ^(legacy-[0-9a-f]{64}|[0-9a-f]{40})$ ]] || { echo 'Invalid release ID.' >&2; exit 1; }
            printf 'aurix-games-%s' "$1"
          }
          list_releases() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          }
          draft_release() {
            jq -cs --arg tag "$1" '
              [ .[][] | select(.tag_name == $tag) ]
              | if length > 1 or any(.[]; .draft != true)
                then error("Games release must be a unique draft")
                else .[0] // empty end
            '
          }
          download_release() {
            local release name asset
            release="$(list_releases | draft_release "$1")"
            test -n "$release"
            for name in aurix-games.tgz aurix-games.manifest.json; do
              asset="$(jq -er --arg name "$name" '
                [.assets[] | select(.name == $name and .state == "uploaded") | .id]
                | if length == 1 then .[0] else error("Expected one uploaded asset") end
              ' <<< "$release")"
              gh api -H 'Accept: application/octet-stream' \
                "repos/${GITHUB_REPOSITORY}/releases/assets/$asset" > "$2/$name"
            done
          }
          ensure_release() {
            local tag="$1" archive="$2" manifest="$3" title="$4" target="${5:-$GITHUB_SHA}"
            local release
            release="$(list_releases | draft_release "$tag")"
            if [[ -z "$release" ]]; then
              local upload="$dir/upload-$tag"
              mkdir -m 700 "$upload"
              cp "$archive" "$upload/aurix-games.tgz"
              cp "$manifest" "$upload/aurix-games.manifest.json"
              gh release create "$tag" "$upload/aurix-games.tgz" "$upload/aurix-games.manifest.json" \
                --target "$target" --draft --title "$title" \
                --notes "Internal Games recovery package. SHA-256: $(jq -r .source_sha256 "$manifest")"
            fi
          }

          if [[ "$INPUT_OPERATION" == deploy ]]; then
            sha="$INPUT_COMMIT"
            active_commit="$(jq -r '.active.commit_sha // ""' <<< "$state")"
            if [[ -n "$active_commit" ]]; then
              git merge-base --is-ancestor "$active_commit" "$sha"
            fi
            archive="$dir/candidate.tgz"
            result="$(python scripts/package_game_store.py --commit "$sha" --output "$archive")"
            candidate_digest="$(jq -er .source_sha256 <<< "$result")"
            python scripts/package_game_store.py --commit "$sha" --output "$archive" --verify-digest "$candidate_digest" >/dev/null
            if jq -e '. == null' <<< "$state" >/dev/null; then
              python scripts/aurix_games_release_transport.py snapshot --archive "$dir/legacy.tgz" > "$dir/snapshot.json"
              previous="$(jq -er .release_id "$dir/snapshot.json")"
              previous_tag="$(release_tag "$previous")"
              ensure_release "$previous_tag" "$dir/legacy.tgz" "$dir/legacy.manifest.json" "AuriX Games legacy rollback"
              previous_dir="$dir/previous"
              mkdir -m 700 "$previous_dir"
              download_release "$previous_tag" "$previous_dir"
              python - "$previous_dir/aurix-games.tgz" "$dir/legacy.manifest.json" "$previous" <<'PY'
          import json, sys
          from pathlib import Path
          from scripts.package_game_store import verify_release_package
          archive, source_manifest, release_id = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          expected = json.loads(source_manifest.read_text())
          actual = json.loads(archive.with_suffix(".manifest.json").read_text())
          verify_release_package(archive, expected["source_sha256"], expected_release_id=release_id)
          if actual != expected:
              raise SystemExit("retained rollback manifest differs from the server snapshot")
          PY
              cmp -s "$dir/legacy.tgz" "$previous_dir/aurix-games.tgz"
            else
              active="$(jq -er '.active.release_id' <<< "$state")"
              active_tag="$(release_tag "$active")"
              active_dir="$dir/active"
              mkdir -m 700 "$active_dir"
              download_release "$active_tag" "$active_dir"
              active_digest="$(jq -er '.active.source_sha256' <<< "$state")"
              python - "$active_dir/aurix-games.tgz" "$active_digest" "$active" "$(jq -r '.active.commit_sha // ""' <<< "$state")" <<'PY'
          import sys
          from pathlib import Path
          from scripts.package_game_store import verify_release_package
          archive, digest, release_id, commit = sys.argv[1:]
          verify_release_package(Path(archive), digest, expected_commit=commit or None, expected_release_id=release_id)
          PY
            fi
            candidate_tag="$(release_tag "$sha")"
            ensure_release "$candidate_tag" "$dir/candidate.tgz" "$dir/candidate.manifest.json" "AuriX Games $sha" "$sha"
            candidate_dir="$dir/candidate-release"
            mkdir -m 700 "$candidate_dir"
            download_release "$candidate_tag" "$candidate_dir"
            python - "$candidate_dir/aurix-games.tgz" "$candidate_digest" "$sha" <<'PY'
          import sys
          from pathlib import Path
          from scripts.package_game_store import verify_release_package
          verify_release_package(Path(sys.argv[1]), sys.argv[2], expected_commit=sys.argv[3], expected_release_id=sys.argv[3])
          PY
            archive="$candidate_dir/aurix-games.tgz"
            digest="$(jq -er .source_sha256 "$candidate_dir/aurix-games.manifest.json")"
            active="$(jq -r '.active.release_id // ""' <<< "$state")"
            if [[ -z "$active" ]]; then
              previous_id="$previous"
            else
              previous_id="$active"
            fi
            result="$(python scripts/aurix_games_release_transport.py send --operation deploy \
              --archive "$archive" --release-id "$sha" --digest "$digest" --commit "$sha" \
              --expected-active "$active" --previous-release "$previous_id")"
          elif [[ "$INPUT_OPERATION" == rollback ]]; then
            active="$(jq -er '.active.release_id' <<< "$state")"
            target="$(jq -er '.rollback.release_id' <<< "$state")"
            target_digest="$(jq -er '.rollback.source_sha256' <<< "$state")"
            commit="$(jq -r '.rollback.commit_sha // ""' <<< "$state")"
            tag="$(release_tag "$target")"
            target_dir="$dir/rollback"
            mkdir -m 700 "$target_dir"
            download_release "$tag" "$target_dir"
            python - "$target_dir/aurix-games.tgz" "$target_digest" "$target" "$commit" <<'PY'
          import sys
          from pathlib import Path
          from scripts.package_game_store import verify_release_package
          archive, digest, release_id, commit = sys.argv[1:]
          verify_release_package(Path(archive), digest, expected_commit=commit or None, expected_release_id=release_id)
          PY
            result="$(python scripts/aurix_games_release_transport.py send --operation rollback \
              --archive "$target_dir/aurix-games.tgz" --release-id "$target" --digest "$target_digest" \
              --commit "$commit" --expected-active "$active")"
          else
            echo 'Unsupported production operation.' >&2
            exit 1
          fi

          printf '%s\n' "$result" > "$dir/result.json"
          jq -e '.status == "deployed" or .status == "already_active"' "$dir/result.json" >/dev/null
          active_id="$(jq -er '.active.release_id' "$dir/result.json")"
          rollback_id="$(jq -r '.rollback.release_id // ""' "$dir/result.json")"
          active_tag="$(release_tag "$active_id")"
          rollback_tag="$(release_tag "$rollback_id")"
          python scripts/aurix_games_release_transport.py status > "$dir/confirmed.json"
          jq -e --slurpfile result "$dir/result.json" '
            .status == "ok" and .state.active == $result[0].active
            and .state.rollback == $result[0].rollback
          ' "$dir/confirmed.json" >/dev/null
          list_releases | jq -r --arg active "$active_tag" --arg rollback "$rollback_tag" '
            .[] | select(.draft == true
              and (.tag_name | test("^aurix-games-(legacy-[0-9a-f]{64}|[0-9a-f]{40})$"))
              and .tag_name != $active and .tag_name != $rollback) | .id
          ' > "$dir/prune-ids.txt"
          while IFS= read -r release_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$release_id"
          done < "$dir/prune-ids.txt"
          {
            printf 'Operation: %s\n\nActive release: `%s`\n\nRollback release: `%s`\n' \
              "$INPUT_OPERATION" "$active_id" "$rollback_id"
            printf 'Server state confirmed after activation. Retained Games releases: active and rollback only.\n'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          GAMES_DEPLOY_HOST: ${{ vars.GAMES_DEPLOY_HOST }}
          GAMES_DEPLOY_PORT: ${{ vars.GAMES_DEPLOY_PORT }}
          GAMES_DEPLOY_PRIVATE_KEY: ${{ secrets.GAMES_DEPLOY_PRIVATE_KEY }}
          GAMES_DEPLOY_KNOWN_HOSTS: ${{ secrets.GAMES_DEPLOY_KNOWN_HOSTS }}
