name: Games CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: games-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.paths.outputs.games }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 100
          persist-credentials: false
      - id: paths
        name: Determine Games scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) python3 scripts/game_store_scope.py --pull-request --base "$PR_BASE" --head "$PR_HEAD" ;;
            push) python3 scripts/game_store_scope.py --base "$BEFORE" --head "$GITHUB_SHA" ;;
            workflow_dispatch) printf 'games=true\n' ;;
            *) exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

  games-tests:
    name: Games tests
    needs: scope
    if: ${{ needs.scope.outputs.games == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.4'
          cache: pip
          cache-dependency-path: config/games/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked Games dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r config/games/requirements.lock
      - name: Set up the existing order browser suite
        run: |
          command -v google-chrome
          npm install --prefix "$RUNNER_TEMP/games-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          printf 'AURIX_PLAYWRIGHT_MODULE=%s\n' "$RUNNER_TEMP/games-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Validate Games
        run: python scripts/run_game_store_checks.py

  games-check:
    name: Games check
    if: ${{ always() }}
    needs: [scope, games-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      GAMES_CHANGED: ${{ needs.scope.outputs.games }}
      TEST_RESULT: ${{ needs.games-tests.result }}
    steps:
      - name: Report Games check
        run: |
          test "$SCOPE_RESULT" = success
          case "$GAMES_CHANGED:$TEST_RESULT" in
            true:success) echo 'Games tests passed' ;;
            false:skipped) echo 'No Games or shared changes' ;;
            *) echo 'Games validation did not complete as required' >&2; exit 1 ;;
          esac
