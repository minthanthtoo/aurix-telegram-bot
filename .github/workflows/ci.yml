name: AuriX CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      other: ${{ steps.paths.outputs.other }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 100
          persist-credentials: false
      - id: paths
        name: Determine check scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) python3 scripts/game_store_scope.py --pull-request --base "$PR_BASE" --head "$PR_HEAD" ;;
            push) python3 scripts/game_store_scope.py --base "$BEFORE" --head "$GITHUB_SHA" ;;
            *) exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

  test:
    needs: scope
    if: ${{ needs.scope.outputs.other == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run Ruff
        run: ruff check .

      - name: Run unit and integration-contract tests
        run: python -m scripts.run_product_checks

      - name: Check shell deployment scripts
        run: bash -n deploy/recover_control_plane.sh deploy/node_bootstrap.sh

      - name: Check whitespace and unresolved merge markers
        run: |
          git diff --check
          if grep -RIn --exclude-dir=.git --exclude-dir=__pycache__ \
            -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo 'unresolved merge marker found' >&2
            exit 1
          fi

  # Compatibility check for already-installed deployers. Older releases
  # looked specifically for this name; keep it as a single, visible aggregate
  # over the Python-version matrix while newer deployers accept every check.
  safety-net:
    if: ${{ always() }}
    needs: [scope, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix test to pass
        if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.other == 'true' && needs.test.result != 'success' }}
        run: |
          echo "matrix test result: ${{ needs.test.result }}" >&2
          exit 1
      - name: Require path classification to pass
        if: ${{ always() && needs.scope.result != 'success' }}
        run: |
          echo "path classification result: ${{ needs.scope.result }}" >&2
          exit 1
      - name: CI aggregate passed
        if: ${{ always() && needs.scope.result == 'success' && (needs.scope.outputs.other != 'true' || needs.test.result == 'success') }}
        run: echo "AuriX CI safety-net passed"
