name: AuriX CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run Ruff
        run: ruff check .

      - name: Run unit and integration-contract tests
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Check shell deployment scripts
        run: bash -n deploy/recover_control_plane.sh deploy/node_bootstrap.sh

      - name: Check whitespace and unresolved merge markers
        run: |
          git diff --check
          if grep -RIn --exclude-dir=.git --exclude-dir=__pycache__ \
            -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo 'unresolved merge marker found' >&2
            exit 1
          fi

  # Compatibility check for already-installed deployers. Older releases
  # looked specifically for this name; keep it as a single, visible aggregate
  # over the Python-version matrix while newer deployers accept every check.
  safety-net:
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix test to pass
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "matrix test result: ${{ needs.test.result }}" >&2
          exit 1
      - name: CI aggregate passed
        run: echo "AuriX CI safety-net passed"
