name: AuriX CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run Ruff
        run: ruff check .

      - name: Enforce architecture reduction ratchet
        run: python tools/check_architecture.py

      - name: Check extracted typed contracts
        run: pyright

      - name: Run unit and integration-contract tests
        run: |
          coverage run -m unittest discover -s . -p 'test_*.py'
          coverage report
          coverage json -o coverage.json
          python tools/check_coverage_scope.py coverage.json

      - name: Check shell deployment scripts
        run: bash -n deploy/recover_control_plane.sh deploy/node_bootstrap.sh

      - name: Check whitespace and unresolved merge markers
        run: |
          git diff --check
          if grep -RIn --exclude-dir=.git --exclude-dir=__pycache__ \
            -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo 'unresolved merge marker found' >&2
            exit 1
          fi

  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aurix-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURIX_TEST_POSTGRES_DSN: postgresql://postgres:aurix-test-only@127.0.0.1:5432/postgres
      AURIX_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest test_database_contracts -v

  # Compatibility check for already-installed deployers. Older releases
  # looked specifically for this name; keep it as a single, visible aggregate
  # over the Python-version matrix while newer deployers accept every check.
  safety-net:
    if: ${{ always() }}
    needs: [test, postgres-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix test to pass
        if: ${{ needs.test.result != 'success' || needs.postgres-contracts.result != 'success' }}
        run: |
          echo "matrix test result: ${{ needs.test.result }}" >&2
          exit 1
      - name: CI aggregate passed
        run: echo "AuriX CI safety-net passed"
