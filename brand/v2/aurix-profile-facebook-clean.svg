<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">AuriX clean Facebook profile avatar</title>
  <desc id="desc">A full-bleed midnight AuriX avatar designed to avoid a white halo under circular platform cropping.</desc>
  <rect width="1080" height="1080" fill="#071521"/>
  <rect x="17" y="17" width="1046" height="1046" rx="280" fill="none" stroke="#18334A" stroke-width="4"/>
  <g transform="translate(100 100) scale(2.1)">
    <path d="M112 398 239 116" fill="none" stroke="url(#gold)" stroke-width="50" stroke-linecap="round"/>
    <path d="m239 116 145 282" fill="none" stroke="url(#shared)" stroke-width="50" stroke-linecap="round"/>
    <path d="M167 305h133" fill="none" stroke="#E7EEF5" stroke-width="24" stroke-linecap="round"/>
    <circle cx="325" cy="283" r="33" fill="#071521"/>
    <path d="M408 127 263 398" fill="none" stroke="url(#signal)" stroke-width="42" stroke-linecap="round"/>
  </g>
  <defs>
    <linearGradient id="gold" x1="104" y1="402" x2="250" y2="104" gradientUnits="userSpaceOnUse"><stop stop-color="#FF982F"/><stop offset="1" stop-color="#FFD36A"/></linearGradient>
    <linearGradient id="shared" x1="238" y1="108" x2="388" y2="405" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD36A"/><stop offset=".46" stop-color="#FFC254"/><stop offset=".64" stop-color="#46D9F5"/><stop offset="1" stop-color="#7667F5"/></linearGradient>
    <linearGradient id="signal" x1="410" y1="122" x2="260" y2="402" gradientUnits="userSpaceOnUse"><stop stop-color="#31D9F5"/><stop offset="1" stop-color="#7862F2"/></linearGradient>
  </defs>
</svg>
