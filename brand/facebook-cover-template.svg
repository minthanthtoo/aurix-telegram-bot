  </defs>
  <rect width="1640" height="624" fill="url(#cover-bg)"/>
  <circle cx="1370" cy="270" r="280" fill="#7765FF" opacity="0.08"/>
  <circle cx="1210" cy="390" r="220" fill="#36E2FF" opacity="0.06"/>
  <path d="M780 590C1010 480 1060 130 1510 44" fill="none" stroke="url(#aurora-line)" stroke-width="84" stroke-linecap="round"/>
  <path d="M860 624C1080 520 1220 240 1640 190" fill="none" stroke="#FFC857" stroke-opacity="0.12" stroke-width="3"/>
  <g transform="translate(120 100)">
