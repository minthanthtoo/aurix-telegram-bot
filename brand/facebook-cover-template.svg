<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" role="img" aria-labelledby="title desc">
  <title id="title">AuriX Facebook cover template</title>
  <desc id="desc">Midnight Facebook cover with an aurora gateway motif, AuriX logo, and launch-safe message.</desc>
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1640" y2="624" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="0.58" stop-color="#0D2235"/>
      <stop offset="1" stop-color="#151A3B"/>
    </linearGradient>
    <linearGradient id="aurora-line" x1="770" y1="590" x2="1510" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36E2FF" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#36E2FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7765FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark-gold" x1="104" y1="214" x2="235" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9F43"/>
      <stop offset="1" stop-color="#FFD66B"/>
