    <path d="M43 186 101 57c4-9 17-9 21 0l58 129" fill="none" stroke="url(#mark-gold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m73 119 78 47m0-47-78 47" fill="none" stroke="#36E2FF" stroke-width="16" stroke-linecap="round"/>
  </g>
  <text x="390" y="226" fill="#F6F8FC" font-family="Inter, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-5">Auri<tspan fill="#36E2FF">X</tspan></text>
  <text x="397" y="294" fill="#FFC857" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1">CLEAR ACCESS. HUMAN HELP.</text>
  <text x="397" y="355" fill="#C9D4DF" font-family="Noto Sans Myanmar, Inter, Arial, sans-serif" font-size="28" font-weight="500">Myanmar-first VPN access with transparent plans.</text>
  <rect x="397" y="405" width="310" height="64" rx="32" fill="#FFC857"/>
  <text x="552" y="447" fill="#071421" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">START ON TELEGRAM</text>
