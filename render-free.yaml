# Experimental $0 pilot profile.
# Use this file as the Blueprint path; it is not the persistent MVP profile in
# render.yaml.  The application state is stored in Supabase PostgreSQL.
services:
  - type: web
    name: aurix-telegram-bot-free
    runtime: python
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python deploy/render_preflight.py --live && python -u deploy/render_web.py
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: AURIX_STORAGE_MODE
        value: postgres
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: AURIX_CONTROL_GROUP_ID
        sync: false
      - key: TRIAL_TELEGRAM_IDS
        value: ""
      - key: OUTLINE_API_URL
        sync: false
      - key: OUTLINE_CERT_SHA256
        sync: false
      - key: OUTLINE_SERVERS_JSON
        sync: false
      - key: OUTLINE_DEFAULT_SERVER_ID
        sync: false
      - key: OUTLINE_REQUEST_TIMEOUT_SECONDS
        value: "5"
      - key: OUTLINE_CIRCUIT_BREAKER_SECONDS
        value: "60"
      - key: AURIX_SERVER_HEALTH_MAX_AGE_SECONDS
        value: "900"
      - key: AURIX_ENDPOINT_FAILURE_THRESHOLD
        value: "3"
      - key: AURIX_ENDPOINT_RECOVERY_THRESHOLD
        value: "2"
      - key: AURIX_ACCESS_URL_KEY
        sync: false
      - key: COMMERCE_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_RECEIPTS_BUCKET
        value: payment-receipts
      - key: RECEIPT_STORAGE_REQUIRED
        value: "1"
      - key: RECEIPT_VISION_REQUIRED
        value: "1"
      - key: RECEIPT_LLM_BASE_URL
        sync: false
      - key: RECEIPT_LLM_MODEL
        sync: false
      - key: RECEIPT_LLM_API_KEY
        sync: false
      - key: RECEIPT_LLM_FALLBACK_MODELS
        sync: false
      - key: RECEIPT_LLM_SELECTION_MODE
        value: first_acceptable
      - key: PAYMENT_RECIPIENTS_JSON
        sync: false
      - key: ALLOW_TEXT_PAYMENT_REFERENCES
        value: "0"
      - key: AURIX_MAINTENANCE_INTERVAL_SECONDS
        value: "60"
      - key: AURIX_LATENCY_LOG
        value: "0"
      - key: AURIX_FLEET_REGISTRATION_ENABLED
        value: "0"
      - key: AURIX_FLEET_AUTO_REGISTRATION_ENABLED
        value: "0"
      - key: AURIX_FLEET_REGISTRATION_URL
        sync: false
      - key: AURIX_FLEET_ENROLLMENT_KEY
        sync: false
      - key: AURIX_FLEET_NODES_JSON
        sync: false
      - key: AURIX_FLEET_STRICT_ALLOCATION_VALIDATION
        value: "0"
