# Experimental $0 pilot profile.
# Use this file as the Blueprint path; it is not the persistent MVP profile in
# render.yaml.  The application state is stored in Supabase PostgreSQL.
services:
  - type: web
    name: aurix-telegram-bot-free
    runtime: python
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python deploy/render_preflight.py && python -u deploy/render_web.py
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: AURIX_STORAGE_MODE
        value: postgres
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: TRIAL_TELEGRAM_IDS
        value: ""
      - key: OUTLINE_API_URL
        sync: false
      - key: OUTLINE_CERT_SHA256
        sync: false
      - key: AURIX_ACCESS_URL_KEY
        sync: false
      - key: COMMERCE_DATABASE_URL
        sync: false
      - key: RECEIPT_LLM_BASE_URL
        value: ""
      - key: RECEIPT_LLM_MODEL
        value: ""
      - key: RECEIPT_LLM_API_KEY
        value: ""
      - key: ALLOW_TEXT_PAYMENT_REFERENCES
        value: "0"
      - key: AURIX_MAINTENANCE_INTERVAL_SECONDS
        value: "60"
      - key: AURIX_LATENCY_LOG
        value: "0"
